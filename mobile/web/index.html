<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Spice & Scale">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Spice & Scale - Sri Lankan AI Recipe & Nutrition</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #F8FAF9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #F8FAF9;
      z-index: 999999;
      transition: opacity 0.35s ease-out;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #E2ECE9;
      border-top: 4px solid #0F766E;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      color: #134E4A;
      margin: 0;
    }
    .subtitle {
      font-size: 14px;
      color: #64748B;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <h2 class="title">Spice & Scale</h2>
    <p class="subtitle">Loading Sri Lankan Recipes & Nutrition...</p>
  </div>
  <script>
    function removeLoading() {
      var loader = document.getElementById("loading");
      if (loader && loader.style.display !== 'none') {
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 350);
      }
    }
    window.addEventListener('flutter-first-frame', removeLoading);
    window.addEventListener('load', function() {
      var observer = new MutationObserver(function(mutations) {
        for (var i = 0; i < mutations.length; i++) {
          var added = mutations[i].addedNodes;
          for (var j = 0; j < added.length; j++) {
            var tag = added[j].tagName;
            if (tag === 'FLUTTER-VIEW' || tag === 'FLT-GLASS-PANE' || tag === 'CANVAS') {
              setTimeout(removeLoading, 100);
              observer.disconnect();
              return;
            }
          }
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
